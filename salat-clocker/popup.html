<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Salat Clocker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Salah Clocker</h1>
    <span id="city"><img id="city-icon" src="assets/icons/pin-64.png" alt=""><span class="city-text"><span id="city-name">Location</span><span id="city-coords" hidden></span></span></span>
  </header>

  <section id="alarm" hidden>
    <img id="alarm-icon" src="assets/icons/masjid-64.png" alt="">
    <div id="alarm-text">Adhan playing</div>
    <button id="alarm-snooze">Snooze</button>
    <button id="alarm-stop">Stop</button>
  </section>

  <section class="clock">
    <div class="sky-times">
      <div class="edge">
        <img src="assets/icons/sunrise-64.png" alt="Sunrise">
        <div class="edge-label">Sunrise</div>
        <div class="edge-time" id="sunrise-time">--:--</div>
      </div>
      <div class="clock-center">
        <div id="clock">--:--</div>
      </div>
      <div class="edge">
        <img src="assets/icons/sunset-64.png" alt="Sunset">
        <div class="edge-label">Sunset</div>
        <div class="edge-time" id="sunset-time">--:--</div>
      </div>
    </div>
    <div id="gdate"></div>
    <div id="hijri"></div>
  </section>

  <section id="prohibited" hidden>
    <span class="pulse"></span>
    <span id="prohibited-text"></span>
  </section>

  <section class="waqt" id="current-card">
    <div class="label">Now</div>
    <div class="row">
      <span class="name" id="current-name">—</span>
      <span class="time" id="current-time"></span>
    </div>
  </section>
  <section class="waqt" id="next-card">
    <div class="label">Next</div>
    <div class="row">
      <span class="name-wrap">
        <span class="name" id="next-name">—</span>
        <span id="next-delay" class="delay-chip" hidden></span>
      </span>
      <span class="time" id="next-time"></span>
    </div>
    <div id="countdown">--</div>
  </section>
  <footer id="footer-main">
    <div class="footer-row">
      <button id="full" class="expand">All Prayer Times</button>
      <button class="icon-btn settings-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
  </footer>
  <section id="all-waqt" hidden>
    <div class="grid" id="grid"></div>
    <footer>
      <div class="footer-row">
        <button id="hide" class="expand">Hide</button>
        <button class="icon-btn settings-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </footer>
  </section>

  <!-- settings slides in over the widget -->
  <section id="settings-panel">
    <div class="settings-bar">
      <button id="settings-back" class="icon-btn" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
      </button>
      <span class="settings-title">Settings</span>
    </div>
    <iframe id="options-frame" src="options.html" title="Settings"></iframe>
  </section>
  <script src="lib/times.js"></script>
  <script src="lib/sky.js"></script>
  <script src="lib/makruh.js"></script>
  <script src="lib/storage.js"></script>
  <script src="lib/api.js"></script>
  <script src="lib/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
