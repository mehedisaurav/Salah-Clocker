<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Azan — Salat Clocker</title>
  <style>
    body {
      width: 368px;
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #12142b;
      color: #fff;
    }
    .wrap { padding: 16px; text-align: center; }
    .wrap img { width: 46px; height: 46px; animation: pulse 2s infinite; }
    h1 { font-size: 19px; margin: 8px 0 2px; }
    .sub { font-size: 11px; color: rgba(255, 255, 255, 0.75); margin-bottom: 14px; }
    .btn {
      border: none;
      border-radius: 18px;
      padding: 8px 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin: 0 4px;
      color: #fff;
    }
    .snooze { background: rgba(255, 255, 255, 0.22); }
    .stop { background: #c62828; }
    .hadith {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      text-align: left;
    }
    .hadith-title {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 8px;
    }
    .hadith-ar {
      direction: rtl;
      font-size: 15px;
      line-height: 1.95;
      margin-bottom: 10px;
      color: #ffffff;
    }
    .hadith-en {
      font-size: 11.5px;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.9);
    }
    .hadith-ref {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 600;
      color: #f2c14e;
    }
    .hadith-ref a { color: #f2c14e; text-decoration: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="assets/icons/masjid-128.png" alt="">
    <h1 id="waqt">Azan</h1>
    <div class="sub" id="status">azan is playing</div>
    <button class="btn snooze" id="snooze">Snooze</button>
    <button class="btn stop" id="stop">Stop</button>

    <div class="hadith" id="hadith" hidden>
      <div class="hadith-title">Hadith of the day</div>
      <div class="hadith-ar" id="hadith-ar" lang="ar" dir="rtl"></div>
      <div class="hadith-en" id="hadith-en"></div>
      <div class="hadith-ref" id="hadith-ref"></div>
    </div>
  </div>
  <script src="lib/storage.js"></script>
  <script src="lib/hadith.js"></script>
  <script src="alarm.js"></script>
</body>
</html>
